spring.application.name=greennest-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/greennest}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Override in production via environment variables.
app.jwt.secret=${JWT_SECRET:change-this-dev-only-secret-please-override-in-prod-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default admin account seeded on first startup if no admin exists yet.
app.admin.email=${APP_ADMIN_EMAIL:admin@greennest.com}
app.admin.password=${APP_ADMIN_PASSWORD:ChangeMe123!}

# Only expose /actuator/health (for container/orchestrator health checks) - never expose
# env, beans, heapdump etc. publicly. show-details stays off so anonymous callers only
# ever see the overall UP/DOWN status, never dependency internals (e.g. DB connection info).
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
