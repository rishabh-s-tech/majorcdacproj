name: CodeQL

on:
  push:
    branches: [main, rishabh]
  pull_request:
    branches: [main, rishabh]
  schedule:
    # Weekly scan even if nobody pushes, so newly-disclosed vulnerability
    # patterns still get checked against the existing code.
    - cron: "0 3 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build backend (manual build-mode required for Java)
        if: matrix.language == 'java-kotlin'
        working-directory: back/greennest-backend-new
        run: |
          chmod +x mvnw
          ./mvnw -B -q clean package -DskipTests

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
