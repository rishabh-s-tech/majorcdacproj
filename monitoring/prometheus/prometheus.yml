global:
  scrape_interval: 15s

scrape_configs:
  # Only resolves inside Docker Compose's local network - will show as DOWN when this
  # runs on Railway, which is expected and harmless (there's no "backend" hostname
  # outside the local compose network).
  - job_name: "greennest-backend-local"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8080"]

  # The live Railway deployment, scraped directly over HTTPS regardless of where this
  # Prometheus instance itself is running.
  - job_name: "greennest-backend-production"
    scheme: https
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["majorcdacproj-production.up.railway.app"]
