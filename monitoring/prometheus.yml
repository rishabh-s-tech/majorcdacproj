global:
  scrape_interval: 15s

scrape_configs:
  # Scrapes the Spring Boot backend's metrics endpoint (exposed via
  # micrometer-registry-prometheus). "backend" resolves via Docker Compose's
  # internal DNS to the backend container - only reachable while running
  # `docker compose up` locally, has nothing to do with the Railway deployment.
  - job_name: "greennest-backend-local"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8080"]

  # Scrapes the LIVE Railway deployment instead, over plain HTTPS - Prometheus
  # doesn't need to run on the same network as its target, just needs a route
  # to it. /actuator/prometheus is permitAll in SecurityConfig (like /actuator/health),
  # so no credentials are needed here either. This is what actually monitors
  # production, regardless of where this Prometheus container itself is running.
  - job_name: "greennest-backend-production"
    scheme: https
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["majorcdacproj-production.up.railway.app"]
